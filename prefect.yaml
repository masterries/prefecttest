name: autoscout-scraper
prefect-version: 3.x

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/masterries/prefecttest.git
      branch: main
  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ git_clone.directory }}"
      requirements_file: requirements.txt

deployments:

  - name: scrape-all
    description: "Scraped alle konfigurierten Fahrzeuge und schreibt in DuckDB (Bronze + Silver)"
    entrypoint: src/flows.py:scrape_all_flow
    work_pool:
      name: autoscout-pool
      work_queue_name: default
    parameters: {}
    schedules:
      - cron: "0 6 * * *"   # täglich 06:00 UTC
        timezone: "Europe/Luxembourg"
        active: true

  - name: scrape-single
    description: "Scraped ein einzelnes Fahrzeug (make + model als Parameter)"
    entrypoint: src/flows.py:scrape_flow
    work_pool:
      name: autoscout-pool
      work_queue_name: default
    parameters:
      make: audi
      model: a4
    schedules: []
