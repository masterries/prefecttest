[project]
name = "mcpscrapper"
version = "0.1.0"
description = "AutoScout24 Luxembourg ETL scraper — Prefect + httpx + selectolax + DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.0",
    "httpx>=0.27",
    "selectolax>=0.3",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "click>=8.0",
]

[project.scripts]
autoscout = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
